<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mini User Interface</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="q10.css">
</head>

<body>

    <!-- ================================
         Header
         ================================ -->

    <header class="site-header">

        <div class="header-content">

            <h1>Welcome to My UI</h1>

            <p>
                A simple responsive user interface
            </p>

        </div>

    </header>


    <!-- ================================
         Main Content
         ================================ -->

    <main>

        <section class="main-card">

            <!-- Image Section -->

            <div class="image-section">

                <img
                    src="https://picsum.photos/id/1018/600/400"
                    alt="Beautiful mountain landscape"
                >

            </div>


            <!-- Content Section -->

            <div class="content-section">

                <h2>Get Started</h2>

                <p class="intro">
                    Fill in the form below to get started
                    with our simple interface.
                </p>


                <!-- Form -->

                <form>

                    <!-- Name -->

                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your name"
                            required
                        >

                    </div>


                    <!-- Email -->

                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <!-- Message -->

                    <div class="form-group">

                        <label for="message">
                            Message
                        </label>

                        <textarea
                            id="message"
                            name="message"
                            rows="4"
                            placeholder="Write your message..."
                        ></textarea>

                    </div>


                    <!-- Buttons -->

                    <div class="button-group">

                        <button
                            type="submit"
                            class="submit-btn"
                        >
                            Submit
                        </button>

                        <button
                            type="reset"
                            class="reset-btn"
                        >
                            Reset
                        </button>

                    </div>

                </form>

            </div>

        </section>

    </main>


    <!-- ================================
         Footer
         ================================ -->

    <footer>

        <p>
            &copy; 2026 Mini User Interface | CSS Practice
        </p>

    </footer>

</body>
</html>

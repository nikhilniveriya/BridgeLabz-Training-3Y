<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image Showcase</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="q3.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Image Showcase</h1>
        <p>Explore beautiful images with CSS hover effects</p>
    </header>


    <!-- Main Content -->
    <main>

        <section class="gallery">

            <!-- Image 1 -->
            <figure class="image-card">
                <div class="image-container">
                    <img src="https://picsum.photos/id/1015/600/400"
                         alt="Mountain landscape">

                    <div class="overlay"></div>
                </div>

                <figcaption>Mountain Landscape</figcaption>
            </figure>


            <!-- Image 2 -->
            <figure class="image-card">
                <div class="image-container">
                    <img src="https://picsum.photos/id/1016/600/400"
                         alt="Beautiful forest">

                    <div class="overlay"></div>
                </div>

                <figcaption>Beautiful Forest</figcaption>
            </figure>


            <!-- Image 3 -->
            <figure class="image-card">
                <div class="image-container">
                    <img src="https://picsum.photos/id/1025/600/400"
                         alt="Cute dog">

                    <div class="overlay"></div>
                </div>

                <figcaption>Cute Dog</figcaption>
            </figure>


            <!-- Image 4 -->
            <figure class="image-card">
                <div class="image-container">
                    <img src="https://picsum.photos/id/1035/600/400"
                         alt="River landscape">

                    <div class="overlay"></div>
                </div>

                <figcaption>River View</figcaption>
            </figure>


            <!-- Image 5 -->
            <figure class="image-card">
                <div class="image-container">
                    <img src="https://picsum.photos/id/1043/600/400"
                         alt="Sea beach">

                    <div class="overlay"></div>
                </div>

                <figcaption>Beautiful Beach</figcaption>
            </figure>


            <!-- Image 6 -->
            <figure class="image-card">
                <div class="image-container">
                    <img src="https://picsum.photos/id/1069/600/400"
                         alt="Nature landscape">

                    <div class="overlay"></div>
                </div>

                <figcaption>Nature View</figcaption>
            </figure>

        </section>

    </main>


    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Image Showcase | CSS Practice</p>
    </footer>

</body>
</html>

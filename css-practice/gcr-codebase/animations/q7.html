<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Interface Components</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="q7.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>UI Components</h1>
        <p>Simple and responsive user interface</p>
    </header>


    <!-- Main Content -->
    <main>

        <section class="ui-card">

            <h2>Explore Products</h2>

            <p class="description">
                Use the search bar and filters to explore different products.
            </p>


            <!-- Search Bar -->
            <div class="search-container">

                <label for="search">Search Products</label>

                <input
                    type="text"
                    id="search"
                    placeholder="Enter product name..."
                >

            </div>


            <!-- Dropdown -->
            <div class="dropdown-container">

                <label for="category">Select Category</label>

                <select id="category">

                    <option value="">Choose a category</option>
                    <option value="electronics">Electronics</option>
                    <option value="clothing">Clothing</option>
                    <option value="books">Books</option>
                    <option value="sports">Sports</option>

                </select>

            </div>


            <!-- Buttons -->
            <div class="button-container">

                <button class="primary-btn">
                    Search
                </button>

                <button class="secondary-btn">
                    Reset
                </button>

            </div>


            <!-- Information -->
            <div class="info-box">
                <h3>Quick Tip</h3>

                <p>
                    Enter a product name, select a category,
                    and click the Search button.
                </p>
            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>
        <p>&copy; 2026 UI Components Practice</p>
    </footer>

</body>
</html>

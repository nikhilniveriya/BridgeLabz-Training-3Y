<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Tooltip Demonstration</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="q2.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>CSS Tooltip Demonstration</h1>
        <p>Hover over the elements to see the tooltips</p>
    </header>


    <!-- Main Content -->
    <main>

        <section class="tooltip-container">

            <!-- Tooltip 1 -->
            <div class="tooltip-box">
                <span class="icon">🔍</span>

                <span class="tooltip-text">
                    Search
                </span>
            </div>


            <!-- Tooltip 2 -->
            <div class="tooltip-box">
                <span class="icon">🏠</span>

                <span class="tooltip-text">
                    Home
                </span>
            </div>


            <!-- Tooltip 3 -->
            <div class="tooltip-box">
                <span class="icon">❤️</span>

                <span class="tooltip-text">
                    Like
                </span>
            </div>


            <!-- Tooltip 4 -->
            <div class="tooltip-box">
                <span class="icon">⚙️</span>

                <span class="tooltip-text">
                    Settings
                </span>
            </div>


            <!-- Tooltip 5 -->
            <div class="tooltip-box">
                <span class="word">Profile</span>

                <span class="tooltip-text">
                    View Profile
                </span>
            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>
        <p>&copy; 2026 CSS Tooltip Practice</p>
    </footer>

</body>
</html>

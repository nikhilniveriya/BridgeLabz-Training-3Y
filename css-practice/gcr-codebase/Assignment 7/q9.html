<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Outline and Focus Styling Form</title>

    <!-- Linking external CSS file -->
    <link rel="stylesheet" href="q9.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Outline and Focus Styling</h1>
        <p>CSS Form Styling Demonstration</p>
    </header>

    <!-- Main Content -->
    <main>

        <!-- Form Section -->
        <section class="form-section">

            <h2>Contact Form</h2>

            <form>

                <!-- Name Input -->
                <div class="form-group">
                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                    >
                </div>


                <!-- Email Input -->
                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                    >
                </div>


                <!-- Subject Input -->
                <div class="form-group">
                    <label for="subject">Subject</label>

                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        placeholder="Enter subject"
                    >
                </div>


                <!-- Message Textarea -->
                <div class="form-group">
                    <label for="message">Message</label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        placeholder="Write your message here..."
                    ></textarea>
                </div>


                <!-- Submit Button -->
                <button type="submit">
                    Submit
                </button>

            </form>

        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>CSS Outline and Focus Practice</p>
    </footer>

</body>
</html>

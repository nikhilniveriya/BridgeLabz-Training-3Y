<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Borders and Padding Demonstration</title>

    <!-- Linking external CSS file -->
    <link rel="stylesheet" href="q1.css">
</head>

<body>

    <!-- Page Header -->
    <header>
        <h1>Borders and Padding Demonstration</h1>
        <p>Different border styles, rounded corners and padding values</p>
    </header>

    <!-- Main Content -->
    <main>

        <section class="box-container">

            <!-- Solid Border -->
            <div class="box solid-box">
                <h2>Solid Border</h2>
                <p>Padding: 20px</p>
            </div>

            <!-- Dashed Border -->
            <div class="box dashed-box">
                <h2>Dashed Border</h2>
                <p>Padding: 30px</p>
            </div>

            <!-- Double Border -->
            <div class="box double-box">
                <h2>Double Border</h2>
                <p>Padding: 15px</p>
            </div>

            <!-- Groove Border -->
            <div class="box groove-box">
                <h2>Groove Border</h2>
                <p>Padding: 25px</p>
            </div>

            <!-- Rounded Corner -->
            <div class="box rounded-box">
                <h2>Rounded Corners</h2>
                <p>border-radius: 25px</p>
            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>CSS Borders & Padding Practice</p>
    </footer>

</body>
</html>

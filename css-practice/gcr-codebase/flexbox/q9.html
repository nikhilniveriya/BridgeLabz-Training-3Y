<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Flip Animation</title>
    <link rel="stylesheet" href="q9.css">
</head>
<body>

    <div class="card-container">

        <div class="card">

            <!-- Front Side -->
            <div class="card-front">
                <img src="https://picsum.photos/400/300" alt="Nature">
                <h2>Nature</h2>
            </div>

            <!-- Back Side -->
            <div class="card-back">
                <h2>About Nature</h2>
                <p>
                    Nature includes everything around us such as plants,
                    animals, mountains, rivers and forests. It is an
                    important part of our environment.
                </p>
            </div>

        </div>

    </div>

</body>
</html>

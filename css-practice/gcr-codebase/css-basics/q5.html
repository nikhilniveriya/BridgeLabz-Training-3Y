
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>
    <link rel="stylesheet" href="q5.css">
</head>
<body>

    <h1>Choose Your Plan</h1>

    <div class="pricing-container">

        <div class="plan">
            <h2>Basic</h2>
            <h3>₹199/month</h3>
            <ul>
                <li>5 Projects</li>
                <li>10 GB Storage</li>
                <li>Email Support</li>
            </ul>
            <a href="#basic" class="btn">Choose Plan</a>
        </div>

        <div class="plan popular">
            <h2>Standard</h2>
            <h3>₹499/month</h3>
            <ul>
                <li>20 Projects</li>
                <li>50 GB Storage</li>
                <li>Priority Support</li>
            </ul>
            <a href="#standard" class="btn">Choose Plan</a>
        </div>

        <div class="plan">
            <h2>Premium</h2>
            <h3>₹999/month</h3>
            <ul>
                <li>Unlimited Projects</li>
                <li>100 GB Storage</li>
                <li>24/7 Support</li>
            </ul>
            <a href="#premium" class="btn">Choose Plan</a>
        </div>

    </div>

</body>
</html>

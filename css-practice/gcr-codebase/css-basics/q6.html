
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="q6.css">
</head>
<body>

    <h1>My Image Gallery</h1>

    <div class="gallery">

        <div class="gallery-item">
            <img src="https://placehold.co/400x300?text=Nature" alt="Nature">
            <div class="caption">Beautiful Nature</div>
        </div>

        <div class="gallery-item">
            <img src="https://placehold.co/400x300?text=Mountains" alt="Mountains">
            <div class="caption">Mountain View</div>
        </div>

        <div class="gallery-item">
            <img src="https://placehold.co/400x300?text=Ocean" alt="Ocean">
            <div class="caption">Blue Ocean</div>
        </div>

        <div class="gallery-item">
            <img src="https://placehold.co/400x300?text=Forest" alt="Forest">
            <div class="caption">Green Forest</div>
        </div>

        <div class="gallery-item">
            <img src="https://placehold.co/400x300?text=City" alt="City">
            <div class="caption">Modern City</div>
        </div>

        <div class="gallery-item">
            <img src="https://placehold.co/400x300?text=Sunset" alt="Sunset">
            <div class="caption">Beautiful Sunset</div>
        </div>

    </div>

</body>
</html>

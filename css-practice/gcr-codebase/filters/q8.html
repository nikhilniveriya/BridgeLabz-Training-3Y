<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison Layout</title>
    <link rel="stylesheet" href="q8.css">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <h1>Filter Comparison</h1>
        <p>Before and After CSS Filter Comparison</p>
    </header>

    <!-- Main Content -->
    <main>
        <section class="comparison">

            <!-- Original Image -->
            <figure class="comparison-item">
                <img
                    src="https://picsum.photos/id/1015/700/450"
                    alt="Original mountain landscape">
                <figcaption>Before - Original Image</figcaption>
            </figure>

            <!-- Filtered Image -->
            <figure class="comparison-item filtered">
                <img
                    src="https://picsum.photos/id/1015/700/450"
                    alt="Filtered mountain landscape">
                <figcaption>After - Brightness Filter</figcaption>
            </figure>

        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 Filter Comparison Layout</p>
    </footer>

</body>
</html>

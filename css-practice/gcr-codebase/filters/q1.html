<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="q1.css">
</head>
<body>

    <header>
        <h1>Image Filter Gallery</h1>
        <p>Different CSS filters applied to images</p>
    </header>

    <main>
        <section class="gallery" aria-label="Image Filter Gallery">

            <figure class="gallery-item">
                <img src="https://picsum.photos/id/1015/600/400" alt="Mountain landscape">
                <figcaption>Blur Filter</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="https://picsum.photos/id/1011/600/400" alt="Mountain and lake">
                <figcaption>Grayscale Filter</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="https://picsum.photos/id/1025/600/400" alt="Dog">
                <figcaption>Sepia Filter</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="https://picsum.photos/id/1035/600/400" alt="River landscape">
                <figcaption>Brightness Filter</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="https://picsum.photos/id/1043/600/400" alt="Forest road">
                <figcaption>Contrast Filter</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="https://picsum.photos/id/1069/600/400" alt="Beach landscape">
                <figcaption>Hue Rotate Filter</figcaption>
            </figure>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 Responsive Gallery</p>
    </footer>

</body>
</html>

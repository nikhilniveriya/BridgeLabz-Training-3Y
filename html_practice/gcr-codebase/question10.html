<!DOCTYPE html>
<html>
<head>
    <title>Dropdown Selection Page</title>
</head>

<body>

    <!-- Page Heading -->
    <h1>Travel Selection Form</h1>

    <p>Select your preferred travel details:</p>

    <!-- Country Selection -->
    <label for="country">Country:</label>

    <select id="country" name="country">
        <option value="india" selected>India</option>
        <option value="usa">USA</option>
        <option value="uk">United Kingdom</option>
        <option value="canada">Canada</option>
    </select>

    <br><br>

    <!-- State Selection -->
    <label for="state">State:</label>

    <select id="state" name="state">
        <option value="up" selected>Uttar Pradesh</option>
        <option value="delhi">Delhi</option>
        <option value="rajasthan">Rajasthan</option>
        <option value="maharashtra">Maharashtra</option>
    </select>

    <br><br>

    <!-- City Selection -->
    <label for="city">City:</label>

    <select id="city" name="city">
        <option value="mathura" selected>Mathura</option>
        <option value="agra">Agra</option>
        <option value="varanasi">Varanasi</option>
        <option value="lucknow">Lucknow</option>
    </select>

    <br><br>

    <!-- Tourist Place Selection -->
    <label for="place">Favorite Tourist Place:</label>

    <select id="place" name="place">
        <option value="tajmahal" selected>Taj Mahal</option>
        <option value="vrindavan">Vrindavan</option>
        <option value="gateway">Gateway of India</option>
        <option value="jaipur">Jaipur</option>
    </select>

    <br><br>

    <!-- Summary -->
    <p>
        <strong>My Choices:</strong>
        I am from India, Uttar Pradesh, Mathura,
        and my favorite tourist place is the Taj Mahal.
    </p>

</body>
</html>

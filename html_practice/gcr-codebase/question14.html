<!DOCTYPE html>
<html>
<head>
    <title>Movie Database</title>
</head>

<body>

    <!-- Page Heading -->
    <h1>Movie Database</h1>


    <!-- Movie Table -->
    <table border="1" title="List of Movies">

        <!-- Caption -->
        <caption>
            Top Movies Collection
        </caption>


        <!-- Table Header -->
        <tr>

            <th>Movie Name</th>
            <th>Genre</th>
            <th>Year</th>
            <th>IMDB Rating</th>
            <th>Link</th>

        </tr>


        <!-- Movie 1 -->
        <tr>

            <td>Interstellar</td>
            <td>Sci-Fi</td>
            <td>2014</td>
            <td>8.7</td>

            <td>
                <a href="https://www.imdb.com">
                    IMDB
                </a>
            </td>

        </tr>


        <!-- Movie 2 -->
        <tr>

            <td>Inception</td>
            <td>Thriller</td>
            <td>2010</td>
            <td>8.8</td>

            <td>
                <a href="https://www.imdb.com">
                    IMDB
                </a>
            </td>

        </tr>


        <!-- Movie 3 -->
        <tr>

            <td>Avengers Endgame</td>
            <td>Action</td>
            <td>2019</td>
            <td>8.4</td>

            <td>
                <a href="https://www.imdb.com">
                    IMDB
                </a>
            </td>

        </tr>


        <!-- Colspan Example -->
        <tr>

            <td colspan="5">
                Latest and popular movies database
            </td>

        </tr>


    </table>


    <!-- Note -->
    <p>
        <small>
            Note: IMDB ratings are shown for educational purposes only.
        </small>
    </p>


</body>
</html>

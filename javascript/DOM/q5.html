
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Gallery</title>
<style>
body { font-family: Arial; margin: 25px; }
.gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}
.gallery img {
    width: 100%;
    height: 150px;
    object-fit: cover;
    cursor: pointer;
    border-radius: 8px;
}
#modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    justify-content: center;
    align-items: center;
    padding: 20px;
}
#modal img {
    max-width: 90%;
    max-height: 85vh;
    border-radius: 8px;
}
#modal.open { display: flex; }
</style>
</head>
<body>
<h2>Image Gallery</h2>

<div class="gallery" id="gallery">
    <img src="https://picsum.photos/id/1015/600/400" alt="Mountain landscape">
    <img src="https://picsum.photos/id/1016/600/400" alt="Forest landscape">
    <img src="https://picsum.photos/id/1018/600/400" alt="Nature landscape">
    <img src="https://picsum.photos/id/1020/600/400" alt="Wildlife">
    <img src="https://picsum.photos/id/1024/600/400" alt="Animal portrait">
    <img src="https://picsum.photos/id/1039/600/400" alt="River landscape">
</div>

<div id="modal" role="dialog" aria-modal="true"
     aria-label="Image preview">
    <img id="modalImage" src="" alt="Large image preview">
</div>

<script>
const gallery = document.getElementById("gallery");
const modal = document.getElementById("modal");
const modalImage = document.getElementById("modalImage");

gallery.addEventListener("click", (event) => {
    if (event.target.tagName !== "IMG") return;

    modalImage.src = event.target.src;
    modalImage.alt = event.target.alt;
    modal.classList.add("open");
});

modal.addEventListener("click", () => {
    modal.classList.remove("open");
    modalImage.src = "";
});

modalImage.addEventListener("click", (event) => {
    event.stopPropagation();
});

document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
        modal.classList.remove("open");
        modalImage.src = "";
    }
});
</script>
</body>
</html>

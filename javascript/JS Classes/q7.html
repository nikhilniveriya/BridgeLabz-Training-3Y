
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Validation</title>
    <style>
        body { font-family: Arial; max-width: 350px; margin: 30px auto; }
        input { padding: 10px; width: 100%; box-sizing: border-box; margin: 8px 0; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h2>Login Form</h2>

    <form id="loginForm" novalidate>
        <input id="username" placeholder="Username">
        <input id="password" type="password" placeholder="Password">
        <button type="submit">Login</button>
    </form>

    <p id="message"></p>

    <script>
        "use strict";

        document.getElementById("loginForm")
            .addEventListener("submit", function (event) {
                event.preventDefault();

                const username = document.getElementById("username").value;
                const password = document.getElementById("password").value;
                const message = document.getElementById("message");
                const errors = [];

                // Username must contain at least 5 characters
                if (username.length < 5) {
                    errors.push("Username must contain at least 5 characters.");
                }

                // Password must contain uppercase, lowercase, digit and special character
                if (password.length < 8) {
                    errors.push("Password must contain at least 8 characters.");
                }
                if (!/[A-Z]/.test(password)) {
                    errors.push("Password needs an uppercase letter.");
                }
                if (!/[a-z]/.test(password)) {
                    errors.push("Password needs a lowercase letter.");
                }
                if (!/[0-9]/.test(password)) {
                    errors.push("Password needs a number.");
                }
                if (!/[^A-Za-z0-9\s]/.test(password)) {
                    errors.push("Password needs a special character.");
                }

                if (errors.length > 0) {
                    message.className = "error";
                    message.textContent = errors.join(" ");
                } else {
                    message.className = "success";
                    message.textContent = "Login validation successful!";
                }

                console.log(errors.length ? errors : "Validation successful");
            });
    </script>
</body>
</html>

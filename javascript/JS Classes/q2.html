
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration</title>
    <style>
        body { font-family: Arial; max-width: 400px; margin: 30px auto; }
        input { width: 100%; padding: 10px; margin: 6px 0; box-sizing: border-box; }
        .valid { border: 2px solid green; }
        .invalid { border: 2px solid red; }
        .error { color: red; font-size: 13px; }
    </style>
</head>
<body>
    <h2>Student Registration</h2>

    <form id="studentForm" novalidate>
        <label>Name</label>
        <input id="name" placeholder="Enter name">
        <div class="error" id="nameError"></div>

        <label>Email</label>
        <input id="email" placeholder="example@domain.com">
        <div class="error" id="emailError"></div>

        <label>Phone</label>
        <input id="phone" placeholder="10-digit phone">
        <div class="error" id="phoneError"></div>

        <label>Password</label>
        <input id="password" type="password" placeholder="Enter password">
        <div class="error" id="passwordError"></div>

        <button type="submit">Register</button>
        <p id="result"></p>
    </form>

    <script>
        "use strict";

        const form = document.getElementById("studentForm");

        const rules = {
            name: /^[A-Za-z]+(?: [A-Za-z]+)*$/,
            email: /^[^\s@]+@[^\s@]+\.[^\s@]+$/,
            phone: /^\d{10}$/,
            password: /^(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9\s]).+$/
        };

        const messages = {
            name: "Name must contain alphabets only.",
            email: "Enter a valid email address.",
            phone: "Phone must contain exactly 10 digits.",
            password: "Password needs uppercase, number and special character."
        };

        form.addEventListener("submit", function (event) {
            event.preventDefault();

            let allValid = true;

            for (const field of Object.keys(rules)) {
                const input = document.getElementById(field);
                const error = document.getElementById(field + "Error");
                const valid = rules[field].test(input.value.trim());

                input.className = valid ? "valid" : "invalid";
                error.textContent = valid ? "" : messages[field];

                if (!valid) allValid = false;
            }

            document.getElementById("result").textContent =
                allValid ? "Registration successful!" : "Please fix the errors.";
        });
    </script>
</body>
</html>

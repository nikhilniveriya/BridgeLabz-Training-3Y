
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movie Ticket Booking</title>
</head>
<body>
    <h2>Book Movie Tickets</h2>

    <form id="bookingForm">
        <input id="name" placeholder="Your name" required><br><br>
        <input id="email" type="email" placeholder="Your email" required><br><br>
        <input id="seats" type="number" min="1" max="10"
               placeholder="Seats (1-10)" required><br><br>
        <button type="submit">Book Tickets</button>
    </form>

    <p id="message"></p>
    <div id="ticket"></div>

    <script>
        "use strict";

        const bookingForm = document.getElementById("bookingForm");

        bookingForm.addEventListener("submit", function (event) {
            event.preventDefault();

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const seats = Number(document.getElementById("seats").value);

            const namePattern = /^[A-Za-z]+(?: [A-Za-z]+)*$/;
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            const message = document.getElementById("message");
            const ticket = document.getElementById("ticket");

            ticket.textContent = "";

            if (!namePattern.test(name)) {
                message.textContent = "Enter a valid name using alphabets only.";
                return;
            }

            if (!emailPattern.test(email)) {
                message.textContent = "Enter a valid email address.";
                return;
            }

            if (!Number.isInteger(seats) || seats < 1 || seats > 10) {
                message.textContent = "Seats must be between 1 and 10.";
                return;
            }

            // Save the validated booking
            const booking = { name, email, seats };

            message.textContent = "Booking successful!";
            ticket.textContent =
                `Name: ${booking.name} | Email: ${booking.email} | Seats: ${booking.seats}`;

            console.log("Booking Details:", booking);
        });
    </script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>URI Encoding</title>
</head>
<body>
    <h1>URI Encoding Example</h1>

    <p>Incorrect URL containing an unencoded space:</p>
    <p>https://example.com/search?query=HTML &amp; CSS</p>

    <p>Correct encoded URL:</p>
    <a href="https://example.com/search?query=HTML%20%26%20CSS">
        Search HTML and CSS
    </a>

</body>
</html>

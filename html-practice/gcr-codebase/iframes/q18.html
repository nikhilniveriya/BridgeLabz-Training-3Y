
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Quotations</title>
</head>
<body>
    <h1>HTML Quotation Tags</h1>

    <h2>Long Quotation</h2>
    <blockquote>
        Learning HTML is an important step in web development.
        It helps us structure webpages using tags such as
        &lt;p&gt;, &lt;h1&gt;, and &amp; other HTML elements.
    </blockquote>

    <h2>Short Quotation</h2>
    <p>
        My teacher often says,
        <q>Practice makes a person better.</q>
    </p>
</body>
</html>

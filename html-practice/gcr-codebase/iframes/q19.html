
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Security</title>
</head>
<body>
    <h1>Secure Information Form</h1>

    <form action="#" method="post" autocomplete="off">
        <label for="username">Username:</label>
        <input type="text" id="username"
               name="username" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email"
               name="email" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password"
               name="password" required>
        <br><br>

        <button type="submit">Submit</button>
    </form>

    <p>
        The autocomplete="off" attribute requests that the browser
        not automatically fill in previously entered form values.
        This can reduce exposure of sensitive information on shared
        devices, but it does not guarantee security.
    </p>
</body>
</html>

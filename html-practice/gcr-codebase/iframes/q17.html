
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Submission</title>
</head>
<body>
    <h1>Simple Form</h1>

    <form action="result.html" method="get" target="resultFrame">
        <label for="username">Enter your name:</label>
        <input type="text" id="username" name="username" required>

        <button type="submit">Submit</button>
    </form>

    <h2>Result</h2>
    <iframe
        name="resultFrame"
        title="Form Submission Result"
        src="result.html"
        width="500"
        height="150">
    </iframe>
</body>
</html>
